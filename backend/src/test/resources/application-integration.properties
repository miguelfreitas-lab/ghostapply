# Sentinela: sem a configuração explícita do contêiner, não existe URL JDBC válida.
# O DataSource de PostgresTestConfiguration usa exclusivamente os dados do contêiner.
spring.datasource.url=jdbc:testcontainers-required:no-fallback
spring.datasource.username=unused
spring.datasource.password=unused
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
